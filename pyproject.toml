[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-therm-pose"
version = "0.1.0"
description = "GPU-ready top-down thermal pose estimation with custom CNN detector and pose models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "pycocotools>=2.0.7",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
