dataset:
  image_root: data/openthermalpose2/images
  annotation_file: data/openthermalpose2/annotations/train.json
  val_image_root: data/openthermalpose2/images
  val_annotation_file: data/openthermalpose2/annotations/val.json
  image_size: [320, 256]
  heatmap_size: [80, 64]
  num_keypoints: 17
  grayscale: true
  body_parts: [head, torso, left_arm, right_arm, left_leg, right_leg]
  head_weight_boost: 1.5
  extremity_weight_boost: 1.25
  limb_weight_boost: 1.15
model:
  name: pose_resnet101_se_thermal_ppm_xh
optim:
  batch_size: 4
  epochs: 36
  lr: 0.0004
  workers: 4
augmentation:
  partial_crop_prob: 0.15
detector:
  image_size: [320, 320]
  score_threshold: 0.18
runtime:
  device: auto
  detector_device: cuda:0
  pose_device: cuda:1
