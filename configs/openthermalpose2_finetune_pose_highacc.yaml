dataset:
  image_root: data/openthermalpose2/images
  annotation_file: data/openthermalpose2/annotations/train.json
  val_image_root: data/openthermalpose2/images
  val_annotation_file: data/openthermalpose2/annotations/val.json
  image_size: [256, 192]
  heatmap_size: [64, 48]
  num_keypoints: 17
  grayscale: true
  body_parts: [head, torso, left_arm, right_arm, left_leg, right_leg]
  head_weight_boost: 1.25
  extremity_weight_boost: 1.15
  limb_weight_boost: 1.08
model:
  name: pose_resnet101_se_thermal_ppm
optim:
  batch_size: 6
  epochs: 48
  lr: 0.00035
  weight_decay: 0.0001
  workers: 4
augmentation:
  flip_prob: 0.5
  scale_jitter: 0.18
  rotate_deg: 12.0
  partial_crop_prob: 0.2
  intensity_jitter: 0.08
detector:
  image_size: [320, 320]
  score_threshold: 0.2
runtime:
  device: auto
  detector_device: cuda:0
  pose_device: cuda:1
