dataset:
  image_root: data/coco/train2017
  annotation_file: data/coco/annotations/person_keypoints_train2017.json
  val_image_root: data/coco/val2017
  val_annotation_file: data/coco/annotations/person_keypoints_val2017.json
  image_size: [256, 192]
  heatmap_size: [64, 48]
  num_keypoints: 17
  grayscale: true
  body_parts: [head, torso, left_arm, right_arm, left_leg, right_leg]
model:
  name: pose_resnet101_se_thermal_direct
optim:
  batch_size: 8
  epochs: 32
  lr: 0.0007
  weight_decay: 0.0001
  workers: 4
augmentation:
  flip_prob: 0.5
  scale_jitter: 0.18
  rotate_deg: 12.0
  partial_crop_prob: 0.15
  intensity_jitter: 0.08
detector:
  image_size: [320, 320]
  score_threshold: 0.2
runtime:
  device: auto
  detector_device: cuda:0
  pose_device: cuda:1
